

global:
  credentialsSecretName: "arguz-credentials"
  clusterCredentials:
    projectId: "<your-project-id>"
    clusterId: "<your-cluster-id>"
    clusterToken: "<your-cluster-token>"

Discovery-Agent:
  replicaCount: 2
  image:
    repository: ghcr.io/arguz-labs/arguz-discovery-agent
    pullPolicy: IfNotPresent
    tag: "v1.0.2"
    # digest: "sha256:..." # When set, renders repository@digest and takes precedence over tag.

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    API_URL: "https://api-discover.arguz.io"
    HEALTH_ADDR: "0.0.0.0:8080"

  # Lets Discovery-Agent upgrade this Helm release through the Helm SDK. It must
  # be explicitly enabled for each Helm installation/cluster; catalog assignment
  # alone cannot enable it. The chart reference is intentionally fixed by
  # default; no registry allowlist is applied.
  selfUpgrade:
    enabled: false
    pollInterval: "5m"
    chartRef: "oci://ghcr.io/arguz-labs/arguz-agent"
    timeout: "5m"
    lock:
      name: ""
      namespace: ""
    # Applied only when self-upgrade is enabled. Keep the pre-stop delay below
    # the grace period so the old leader can remain available during handoff.
    rollout:
      terminationGracePeriodSeconds: 120
      preStopDelaySeconds: 30

  config:
    configMapName: ""
    mountPath: "/"
    fileName: "config.yaml"
    filePath: "/config.yaml"
    content: |
      log_level: info
      ignore_namespaces:
        - kube-system
      ignore_resources:
        - job/*

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # The distroless agent serves health checks at /healthz on the named health port.
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

Scaling-Rules-Agent:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/arguz-labs/arguz-scaling-rules-agent
    pullPolicy: IfNotPresent
    tag: "v1.0.2"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    API_URL: "https://api-scaling-rules.arguz.io"
    LOG_LEVEL: "info"
    IGNORE_RESOURCES: ""

  nodeSelector: {}

  tolerations: []

  affinity: {}
