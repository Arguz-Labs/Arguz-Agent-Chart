{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "Arguz-Node-Agent.fullname" . }}
  labels:
    {{- include "Arguz-Node-Agent.labels" . | nindent 4 }}
  annotations:
    {{- include "Arguz-Node-Agent.annotations" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "Arguz-Node-Agent.fullname" . }}
  labels:
    {{- include "Arguz-Node-Agent.labels" . | nindent 4 }}
  annotations:
    {{- include "Arguz-Node-Agent.annotations" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "Arguz-Node-Agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "Arguz-Node-Agent.fullname" . }}
{{- end }}
