{{- if and .Values.enabled .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ default (printf "%s-priority" (include "Arguz-Node-Agent.fullname" .)) .Values.priorityClass.name }}
  labels:
    {{- include "Arguz-Node-Agent.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
description: {{ .Values.priorityClass.description | quote }}
{{- end }}
